# M5Stack NanoC6 MSXY
substitutions:
  name: m5nanoc6-MB-ac
  friendly_name: MB AC CN105
  remote_temp_sensor: sensor.mb_temperature_sensor_mean

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 200
    then:
      - delay: 30s
      - light.turn_off:
          id: rgb_led

esp32:
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

# Enable logging
logger:
  level: INFO
  logs:
    CN105Climate: WARN
    climate: WARN
    sensor: WARN
    WRITE : WARN
    READ : WARN

# Enable Home Assistant API
api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
     ssid: "${friendly_name} Fallback Hotspot"
     password: !secret wifi_fallback_password

captive_portal:


# network:
#   enable_ipv6: true

# openthread:
#   tlv: !secret thread_tlv
#   # device_type: FTD

uart:
  id: HP_UART
  baud_rate: 2400
  tx_pin: GPIO1
  rx_pin: GPIO2

# External component reference
external_components:
  - source: github://echavet/MitsubishiCN105ESPHome

# Climate entity configuration
climate:
  - platform: cn105
    id: ${name}
    name: ${friendly_name}
    icon: mdi:thermostat
    visual:
      min_temperature: 16
      max_temperature: 30
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.1

    # remote_temperature_timeout: 30min
    debounce_delay : 500ms
    update_interval: 4s

    compressor_frequency_sensor:
      name: ${name} Compressor Frequency
      entity_category: diagnostic
      disabled_by_default: false # works
    vertical_vane_select:
      name: ${name} Vertical Vane  
      disabled_by_default: false # works
    stage_sensor:
      name: Stage or Fan state
      entity_category: diagnostic
      disabled_by_default: false # works
    sub_mode_sensor:
      name: Sub Mode
      entity_category: diagnostic
      disabled_by_default: false # works
    auto_sub_mode_sensor:
      name: Auto Mode
      entity_category: diagnostic
      disabled_by_default: false # works


# below taken from https://github.com/bogorad/m5stack-m5NanoC6-esphome/blob/main/packages/generic_m5stack-nano-c6.yaml combined with https://github.com/yoziru/esphome-m5-btproxy/tree/main


### IR transmitter stopped working 2025/02
# remote_transmitter:
#   pin: GPIO3
#   # Infrared remotes use a 50% carrier signal
#   carrier_duty_percent: 50%
#   # rmt_channel: 1

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO20
    num_leds: 1
    # rmt_channel: 0 ### this stopped working 2025/02
    chipset: WS2812
    is_rgbw: true
    restore_mode: ALWAYS_ON # light is on during boot. Will be turned off after 30s delay
    id: rgb_led
    name: "Light"
    icon: "mdi:led-outline"
    power_supply: rgbpwr
    effects:
      - random:
      - flicker:
      - addressable_rainbow:

power_supply:
  - id: 'rgbpwr'
    enable_on_boot: true
    pin: GPIO19
    enable_time: 10ms
    keep_on_time: 10ms

switch:
  - platform: gpio
    pin: GPIO7
    name: "on board LED"

sensor:
  - platform: homeassistant
    name: "Remote Temperature Sensor"
    entity_id: ${remote_temp_sensor} # Replace with your HomeAssistant remote sensor entity id, or include in substitutions
    internal: false # doesn't mean internal temp sensor in this case - it is an ESPHome saying "is this sensor fully internal to the ESPHome device? Or should I show it to HomeAssistant?" TRUE would mean that the device won't send the value to HomeAssistant. FALSE means it sends the value to HomeAssistant, but the entity is disabled by default. 
    disabled_by_default: true
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    filters:
    # Uncomment the lambda line to convert F to C on incoming temperature
    #  - lambda: return (x - 32) * (5.0/9.0);
      - clamp: # Limits values to range accepted by Mitsubishi units
          min_value: 1
          max_value: 40
          ignore_out_of_range: true
      - throttle: 30s
    on_value:
      then:
        - logger.log:
            level: WARN
            format: "Remote temperature received from HA: %.1f C"
            args: [ 'x' ]
        - lambda: 'id(hp).set_remote_temperature(x);'
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: Uptime
    id: sys_uptime
    update_interval: 60s

  - platform: internal_temperature
    name: "ESP Temperature"
    id: sys_esp_temperature

button:
  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"
  # - platform: safe_mode
  #   name: "Safe Mode Boot"
  #   entity_category: diagnostic
  #   id: safe_mode_boot_button
  # - platform: factory_reset
  #   name: "Restart with Factory Default Settings"
  #   entity_category: "diagnostic"


text_sensor:
  - platform: wifi_info
    ip_address:
      name: "My IP Address"
      id: wifi_ip_address
    mac_address:
      name: "My Mac Wifi Address"
      id: wifi_mac_address
    ssid:
      name: "Connected SSID"
      id: wifi_connected_ssid
    bssid:
      name: "Connected BSSID"
      id: wifi_connected_bssid
    dns_address:
      name: "DNS Address"
      id: wifi_dns_address
  # - platform: openthread_info
  #   ip_address:
  #     name: "Off-mesh routable IP Address"
  #   channel:
  #     name: "Channel"
  #   role:
  #     name: "Device Role"
  #   rloc16:
  #     name: "RLOC16"
  #   ext_addr:
  #     name: "Extended Address"
  #   eui64:
  #     name: "EUI64"
  #   network_name:
  #     name: "Network Name"
  #   # network_key:
  #   #   name: "Network Key"
  #   pan_id:
  #     name: "PAN ID"
  #   ext_pan_id:
  #     name: "Extended PAN ID"
  - platform: version
    name: Version
    hide_timestamp: true
    disabled_by_default: false
    icon: mdi:new-box
    entity_category: diagnostic

# Configuration of M5Stack NanoC6 onboard onboard button
binary_sensor:
  - platform: status
    name: Online
    id: ink_ha_connected
  - platform: gpio
    name: Button
    entity_category: diagnostic
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_off: 10ms
    on_press:
      then:
        - logger.log: Button Pressed
    
time:
  - platform: homeassistant
    id: homeassistant_time
