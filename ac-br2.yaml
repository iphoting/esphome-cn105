# =============================================================================
# ESPHome config for Mitsubishi MSXY-FP10VG via M5Stack NanoC6
# Based on: https://github.com/echavet/MitsubishiCN105ESPHome/discussions/340
# Wiring (Grove port on NanoC6 → CN105 on indoor unit):
#   Pin 1 (Yellow / IO2) → CN105 Pin 4 (TX from unit, RX for ESP)
#   Pin 2 (White / IO1)  → CN105 Pin 5 (RX into unit, TX from ESP)
#   Pin 3 (Red  / 5V)    → CN105 Pin 1 (12V via unit regulator → 5V rail)
#   Pin 4 (Black / GND)  → CN105 Pin 2 (GND)
#   CN105 Pin 3 (3.3V)   → not connected (NanoC6 is self-powered from 5V)
#
# NOTE: The NanoC6 GPIO pins are 3.3 V logic; the CN105 data lines are
# 5 V tolerant in practice (many users run without a level shifter and
# report no issues). If you want to be safe, add a bi-directional level
# shifter between GPIO1/GPIO2 and CN105 pins 4/5.
#
# Secrets required in secrets.yaml:
#   wifi_ssid, wifi_password, wifi_fallback_password
#   encryption_key   (generate with: esphome generate-key)
#   ota_password
#   thread_tlv       (only if you switch to OpenThread later)
# =============================================================================

substitutions:
  name: ac-br2
  friendly_name: BR2 AC  # human-readable label in HA
  # Point this at whichever HA temperature sensor you want the AC
  # to track as the "room" temperature (replaces internal thermistor).
  # Leave blank ("") to disable remote temperature entirely.
  remote_temp_sensor: sensor.br2_temperature_mean
  # Minutes to keep the fan running in FAN_ONLY after a wet COOL/DRY run
  # before actually powering off ("gym sock" coil-dry prevention).
  coil_dry_duration_min: "30"
  # "fan_only" (default): force FAN_ONLY during the dry cycle. Validated on
  # single-outdoor-unit setups.
  # "cool_thermo_off": stay in COOL with a high setpoint instead, so a shared
  # MXZ multi-zone outdoor unit isn't disrupted for sibling zones. Unverified
  # against real multi-zone hardware — see echavet/MitsubishiCN105ESPHome#658.
  coil_dry_method: "fan_only"
  # Setpoint (°C) used during a cool_thermo_off dry cycle to keep the
  # compressor from being called for by this zone.
  coil_dry_target_c: "30"

# ---------------------------------------------------------------------------
# Globals — coil-dry ("gym sock" smell prevention) state
# coil_dry_active / coil_dry_deadline_ms use millis() and are NOT restored
# across a reboot: if the ESP itself restarts mid-dry-cycle, the unit may be
# left running FAN_ONLY until manually turned off. Acceptable tradeoff here;
# a full fix would need wall-clock deadline persistence via the time: source.
# ---------------------------------------------------------------------------
globals:
  - id: coil_was_wet
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: coil_dry_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: coil_dry_deadline_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: coil_dry_real_target_temp
    type: float
    restore_value: no
    initial_value: '0.0'

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 200
    then:
      # Turn off the status LED after 30 s so it doesn't distract
      - delay: 30s
      - light.turn_off:
          id: rgb_led

esp32:
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf   # required for OpenThread; also more stable on C6
  #toolchain: platformio # required for backward compatibility since 2026.7.x

# ---------------------------------------------------------------------------
# Logging
# Reduce verbosity for production. Set CN105Climate to DEBUG when
# troubleshooting the initial handshake.
# ---------------------------------------------------------------------------
logger:
  level: INFO
  logs:
    CN105Climate: WARN
    climate: WARN
    sensor: WARN
    WRITE: WARN
    READ: WARN

# ---------------------------------------------------------------------------
# Home Assistant API
# ---------------------------------------------------------------------------
api:
  encryption:
    key: !secret encryption_key

# ---------------------------------------------------------------------------
# OTA updates
# ---------------------------------------------------------------------------
ota:
  - platform: esphome
    password: !secret ota_password

# ---------------------------------------------------------------------------
# Networking — WiFi (default)
# To switch to OpenThread / Thread instead:
#   1. Comment out the wifi: and captive_portal: blocks
#   2. Uncomment the network: and openthread: blocks below
# ---------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot so you can always reach the device if WiFi changes
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret wifi_fallback_password

captive_portal:

# -- OpenThread (uncomment to use Thread instead of WiFi) --
# network:
#   enable_ipv6: true
#
# openthread:
#   tlv: !secret thread_tlv
#   # device_type: FTD   # uncomment to act as a Full Thread Device (router)

# ---------------------------------------------------------------------------
# UART — CN105 serial bus
# Pull-up on RX is required for reliable operation on newer ESPHome
# (see: https://github.com/echavet/MitsubishiCN105ESPHome/issues/396)
# ---------------------------------------------------------------------------
uart:
  id: HP_UART
  baud_rate: 2400
  tx_pin: GPIO1
  rx_pin:
    number: GPIO2
    mode:
      input: true
      pullup: true   # critical fix for ESPHome 2025.x on NanoC6

# ---------------------------------------------------------------------------
# MitsubishiCN105ESPHome component
# ---------------------------------------------------------------------------
external_components:
  - source: github://echavet/MitsubishiCN105ESPHome

# ---------------------------------------------------------------------------
# Climate entity
# ---------------------------------------------------------------------------
climate:
  - platform: cn105
    id: hp
    uart_id: HP_UART
    name: ${friendly_name}
    icon: mdi:air-conditioner
    visual:
      min_temperature: 16
      max_temperature: 30
      temperature_step:
        target_temperature: 1.0   # CN105 protocol only accepts whole-degree setpoints
        current_temperature: 0.1  # display resolution for current temp sensor

    # Remote temperature: the ESP forwards a HA sensor reading to the unit
    # so the AC uses that value instead of its own thermistor.
    # If remote_temp_sensor substitution is empty, comment this out.
    remote_temperature_timeout: 10min
    debounce_delay: 100ms
    update_interval: 4s

    supports:
      mode: ["COOL", "DRY", "FAN_ONLY"]
      fan_mode: ["AUTO", "QUIET", "LOW", "MEDIUM", "MIDDLE", "HIGH"]
      swing_mode: ["OFF", "VERTICAL"]

    # -- Gym Sock Smell Prevention: coil-dry-on-off --
    # Wet-coil latching, cycle-abandonment, and OFF interception all live in
    # on_state below (see the comment there for why) — on_control here is
    # kept only as a fast path that catches an HA/ESPHome-issued OFF before
    # it's applied, so the entity's mode never flashes through OFF for the
    # common case. The IR remote bypasses on_control entirely, which is why
    # on_state has its own copy of this logic as the correct, complete
    # fallback.
    # See: https://github.com/echavet/MitsubishiCN105ESPHome/issues/658
    on_control:
      - lambda: |-
          if (id(coil_dry_active)) return;  // let this command apply normally;
                                             // on_state will notice the mismatch
                                             // and abandon the cycle
          if (!id(coil_dry_enabled).state) return;
          if (!id(coil_was_wet)) return;

          auto requested_mode = x.get_mode();
          if (!requested_mode.has_value() || *requested_mode != climate::CLIMATE_MODE_OFF) return;

          uint32_t duration_ms = (uint32_t)(${coil_dry_duration_min}) * 60000UL;
          id(coil_dry_active) = true;
          id(coil_dry_deadline_ms) = millis() + duration_ms;

          if (std::string("${coil_dry_method}") == std::string("cool_thermo_off")) {
            // Shared MXZ multi-zone outdoor unit: forcing FAN_ONLY on one
            // zone can interfere with sibling zones still calling for
            // cooling. Instead stay in COOL with a high setpoint so the
            // indoor fan keeps moving air across the coil but this zone's
            // compressor demand drops out.
            id(coil_dry_real_target_temp) = id(hp).target_temperature;
            x.set_mode(climate::CLIMATE_MODE_COOL);
            x.set_fan_mode(climate::CLIMATE_FAN_AUTO);
            x.set_target_temperature((float)(${coil_dry_target_c}));
          } else {
            // Single-zone / dedicated outdoor unit: just run the fan.
            x.set_mode(climate::CLIMATE_MODE_FAN_ONLY);
            x.set_fan_mode(climate::CLIMATE_FAN_AUTO);
          }

    # Coil-dry wet detection + cycle management. Fires on every published
    # state, regardless of source (HA, an ESPHome automation, or the unit's
    # own IR remote — see issue #658 comments), unlike on_control above
    # which only fires for HA/ESPHome-issued commands. This is therefore the
    # single source of truth for wet-latching and cycle-abandonment, and the
    # fallback OFF interception for anything on_control's fast path missed
    # (i.e. the IR remote).
    on_state:
      - lambda: |-
          // Latch "coil is wet" whenever the compressor is actually driven
          // in COOL/DRY. Uses the component's built-in action, derived from
          // the CN105 protocol's dedicated operating-status byte — a more
          // direct/reliable signal on this unit than compressor frequency
          // (unsupported here, see issue #57).
          if (x.action == climate::CLIMATE_ACTION_COOLING || x.action == climate::CLIMATE_ACTION_DRYING) {
            id(coil_was_wet) = true;
          }

          bool cool_thermo_off = std::string("${coil_dry_method}") == std::string("cool_thermo_off");

          if (id(coil_dry_active)) {
            // A dry cycle is running. If the reported state no longer
            // matches what we forced it to, something else changed it (HA
            // or the remote) — abandon the cycle instead of letting the
            // finalizer force an unwanted OFF later.
            bool matches_dry_state = cool_thermo_off
                ? (x.mode == climate::CLIMATE_MODE_COOL && x.target_temperature == (float)(${coil_dry_target_c}))
                : (x.mode == climate::CLIMATE_MODE_FAN_ONLY);
            if (!matches_dry_state) {
              id(coil_dry_active) = false;
              id(coil_dry_deadline_ms) = 0;
              // Known limitation: if cool_thermo_off's setpoint is still
              // sitting at coil_dry_target_c when abandoned (e.g. the
              // remote changed mode but not temperature), it's left there
              // rather than restored — acceptable given cool_thermo_off is
              // already unverified on real multi-zone hardware.
            }
            return;
          }

          if (!id(coil_dry_enabled).state) return;
          if (!id(coil_was_wet)) return;
          if (x.mode != climate::CLIMATE_MODE_OFF) return;

          // Coil is wet and the unit just went OFF without on_control
          // catching it in flight — i.e. this was the IR remote (if
          // on_control's fast path had fired, x.mode here would already be
          // FAN_ONLY/COOL, not OFF). Command the unit back into the
          // dry-cycle mode ourselves; the finalizer below will turn it off
          // for real once coil_dry_duration_min elapses.
          uint32_t duration_ms = (uint32_t)(${coil_dry_duration_min}) * 60000UL;

          auto call = id(hp).make_call();
          if (cool_thermo_off) {
            id(coil_dry_real_target_temp) = x.target_temperature;
            call.set_mode(climate::CLIMATE_MODE_COOL);
            call.set_fan_mode(climate::CLIMATE_FAN_AUTO);
            call.set_target_temperature((float)(${coil_dry_target_c}));
          } else {
            call.set_mode(climate::CLIMATE_MODE_FAN_ONLY);
            call.set_fan_mode(climate::CLIMATE_FAN_AUTO);
          }
          call.perform();

          id(coil_dry_active) = true;
          id(coil_dry_deadline_ms) = millis() + duration_ms;

    # -- Diagnostic / optional sensors --
    # compressor_frequency and sub-mode sensors may return no data on the
    # MSXY-FP10VG (wall-mount only unit). They are disabled by default so
    # they won't clutter your HA dashboard but can be enabled for testing.

    compressor_frequency_sensor:
      name: "${name} Compressor Frequency"
      entity_category: diagnostic
      disabled_by_default: true

    outside_air_temperature_sensor:
      name: "${name} Outside Air Temperature"
      entity_category: diagnostic
      disabled_by_default: false

    vertical_vane_select:
      name: "${name} Vertical Vane"
      disabled_by_default: false   # useful for directing airflow

    stage_sensor:
      name: "${name} Stage"
      id: hp_stage
      entity_category: diagnostic
      disabled_by_default: false

    sub_mode_sensor:
      name: "${name} Sub Mode"
      id: hp_sub_mode
      entity_category: diagnostic
      disabled_by_default: false

    auto_sub_mode_sensor:
      name: "${name} Auto Sub Mode"
      entity_category: diagnostic
      disabled_by_default: false

# ---------------------------------------------------------------------------
# Coil-dry cycle finalizer
# Every 15s, checks whether an active dry cycle has reached its deadline and,
# if so, issues the real OFF command and clears the wet-coil tracking state.
# ---------------------------------------------------------------------------
interval:
  - interval: 15s
    then:
      - lambda: |-
          if (!id(coil_dry_active)) return;
          if (millis() < id(coil_dry_deadline_ms)) return;
          id(coil_dry_active) = false;
          id(coil_dry_deadline_ms) = 0;
          id(coil_was_wet) = false;
          auto call = id(hp).make_call();
          call.set_mode(climate::CLIMATE_MODE_OFF);
          if (std::string("${coil_dry_method}") == std::string("cool_thermo_off")) {
            call.set_target_temperature(id(coil_dry_real_target_temp));
          }
          call.perform();

# ---------------------------------------------------------------------------
# Remote temperature sensor (bridged from HA)
# internal: false  → the value IS sent back to HA (so you can see it)
# disabled_by_default: true → entity exists but is hidden until enabled
# ---------------------------------------------------------------------------
sensor:
  - platform: homeassistant
    name: "Remote Temperature"
    entity_id: ${remote_temp_sensor}
    internal: false
    disabled_by_default: true
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    filters:
      - clamp:
          min_value: 1
          max_value: 40
          ignore_out_of_range: true
      - throttle: 30s
    on_value:
      then:
        - logger.log:
            level: WARN
            format: "Remote temp from HA: %.1f °C"
            args: ['x']
        - lambda: 'id(hp).set_remote_temperature(x);'

  - platform: uptime
    name: Uptime
    id: sys_uptime
    update_interval: 60s

  - platform: internal_temperature
    name: "ESP Internal Temperature"
    id: sys_esp_temperature
    # NanoC6 running Thread can reach ~60-70 °C — this is normal per Espressif
    # datasheet (rated to 105 °C ambient). WiFi-only is typically ~45-55 °C.

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: template
    name: "${name} Coil Dry Remaining"
    id: coil_dry_remaining_sensor
    entity_category: diagnostic
    icon: mdi:timer-sand
    unit_of_measurement: min
    update_interval: 15s
    lambda: |-
      if (!id(coil_dry_active)) return 0.0f;
      uint32_t now = millis();
      uint32_t deadline = id(coil_dry_deadline_ms);
      if (now >= deadline) return 0.0f;
      return (deadline - now) / 60000.0f;

# ---------------------------------------------------------------------------
# Onboard RGB LED (WS2812 on GPIO20, powered via GPIO19)
# Turns on at boot (white) then off after 30 s (see on_boot above)
# ---------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO20
    num_leds: 1
    chipset: WS2812
    is_rgbw: true
    restore_mode: ALWAYS_ON
    id: rgb_led
    name: "Status LED"
    icon: "mdi:led-outline"
    power_supply: rgbpwr
    effects:
      - random:
      - flicker:
      - addressable_rainbow:

power_supply:
  - id: rgbpwr
    enable_on_boot: true
    pin: GPIO19
    enable_time: 10ms
    keep_on_time: 10ms

# ---------------------------------------------------------------------------
# Onboard GPIO switch (user LED on GPIO7)
# ---------------------------------------------------------------------------
switch:
  - platform: gpio
    pin: GPIO7
    name: "Onboard LED"

  - platform: template
    name: "${name} Coil Dry Enabled"
    id: coil_dry_enabled
    icon: mdi:water-off
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# ---------------------------------------------------------------------------
# Binary sensors
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: status
    name: Online
    id: ha_connected

  - platform: template
    name: "${name} Coil Dry Active"
    id: coil_dry_active_sensor
    entity_category: diagnostic
    lambda: return id(coil_dry_active);

  - platform: gpio
    name: "Button"
    entity_category: diagnostic
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_off: 10ms
    on_press:
      then:
        - logger.log: "Onboard button pressed"

# ---------------------------------------------------------------------------
# Utility buttons
# ---------------------------------------------------------------------------
button:
  - platform: restart
    icon: mdi:power-cycle
    name: "Reboot"

# ---------------------------------------------------------------------------
# Text sensors
# ---------------------------------------------------------------------------
text_sensor:
  - platform: version
    name: ESPHome Version
    hide_timestamp: true
    disabled_by_default: false
    icon: mdi:new-box
    entity_category: diagnostic

  # WiFi diagnostics (comment out if using OpenThread)
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    mac_address:
      name: "MAC Address"
    ssid:
      name: "Connected SSID"

  # OpenThread diagnostics (uncomment if using Thread)
  # - platform: openthread_info
  #   ip_address:
  #     name: "Thread IP Address"
  #   channel:
  #     name: "Channel"
  #   role:
  #     name: "Device Role"
  #   network_name:
  #     name: "Network Name"
  #   pan_id:
  #     name: "PAN ID"

# ---------------------------------------------------------------------------
# Time sync from HA
# ---------------------------------------------------------------------------
time:
  - platform: homeassistant
    id: homeassistant_time
